<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cupom Search</title>
    <style>
      body {
        width: 320px; margin: 0; padding: 14px;
        background: #171a21; color: #e8eaf0;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0 0 2px; font-size: 15px; }
      p.sub { margin: 0 0 12px; font-size: 12px; color: #9aa3b2; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
      .code { font: 600 13px ui-monospace, Menlo, monospace; letter-spacing: 0.05em; }
      .meta { font-size: 11px; color: #9aa3b2; }
      .bar { height: 4px; background: #1f232c; border-radius: 999px; margin-top: 6px; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: #4ade80; }
      label { display: block; font-size: 11px; color: #9aa3b2; margin: 12px 0 4px; }
      input {
        width: 100%; padding: 6px 8px; border-radius: 6px;
        border: 1px solid #2a2f3a; background: #0f1115; color: #e8eaf0; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Cupom Search</h1>
    <p class="sub" id="sub">Lendo a aba atual...</p>
    <ul id="list"></ul>
    <label for="api">API</label>
    <input id="api" type="url" />
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
